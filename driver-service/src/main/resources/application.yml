server:
  port: ${PORT:8082}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: driver-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/driver-service;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
ridelink:
  jwt-secret: ${JWT_SECRET}
  service-key: ${SERVICE_API_KEY}
  account-url: ${ACCOUNT_URL:http://127.0.0.1:8081}
  driver-url: ${DRIVER_URL:http://127.0.0.1:8082}
  ride-url: ${RIDE_URL:http://127.0.0.1:8083}
  fare-url: ${FARE_URL:http://127.0.0.1:8084}
springdoc:
  swagger-ui:
    persist-authorization: false
